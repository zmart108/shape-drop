  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(0, 240, 255, ${0.12 * flicker})`;
  ctx.lineWidth = 22;
  ctx.stroke();
  ctx.strokeStyle = `rgba(0, 240, 255, ${0.35 * flicker})`;
  ctx.lineWidth = 9;
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = '#b8fbff';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Danger line (glows and flashes when something is over it)
  ctx.save();
  ctx.setLineDash([12, 9]);
  ctx.lineDashOffset = -gameTime * 30;
  ctx.lineWidth = 3;
  if (danger) {
    ctx.shadowColor = '#ff3b5c';
    ctx.shadowBlur = 16;
    ctx.strokeStyle = Math.sin(gameTime * 18) > 0 ? '#ff3b5c' : '#ffb3c1';
  } else {
    ctx.strokeStyle = 'rgba(255, 92, 154, 0.45)';
  }
  ctx.beginPath();
  ctx.moveTo(left, CONTAINER_TOP);
  ctx.lineTo(right, CONTAINER_TOP);
  ctx.stroke();
  ctx.restore();

  // The shape you're holding (bobs gently, eyes look down at the landing spot)
  if (currentItem && state === 'playing') {
    drawItem(ctx, currentItem, heldX, DROP_Y + Math.sin(gameTime * 3) * 2, 1, { x: 0, y: 1 });
  }
  ctx.restore();

  drawBanner();

  // A hint for brand-new players
  if (dropsCount < 3 && state === 'playing') {
    ctx.font = `15px ${DISPLAY_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(IS_TOUCH ? 'Drag to aim · lift to drop' : 'Mouse or ← → to aim · click or Space to drop', W / 2, CONTAINER_TOP + 28);
  }

  if (state === 'paused') {
    ctx.fillStyle = 'rgba(10, 6, 25, 0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `46px ${DISPLAY_FONT}`;
    ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = `16px ${DISPLAY_FONT}`;
    ctx.fillText(IS_TOUCH ? 'Tap to keep playing' : 'Press P or click to keep playing', W / 2, H / 2 + 40);
  }

  // Full-screen glitch: slide random strips of the picture sideways (huge moments only)
  if (screenGlitch > 0 && FX >= 2) {
    const k = Math.min(1, screenGlitch / 0.3);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (let i = 0; i < 6; i++) {
      const sy = Math.random() * canvas.height;
      const sh = (4 + Math.random() * 26) * DPR;
      const dx = (Math.random() - 0.5) * 50 * DPR * k;
      ctx.drawImage(canvas, 0, sy, canvas.width, sh, dx, sy, canvas.width, sh);
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255, 40, 140, ${0.08 * k})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
  }
}

// Draws one body, including the birth "boing" and glitch flicker
function drawBody(c, b) {
  let vr = b.r;
  if (b.popFrom < 1 && b.anim < POP_TIME) vr = b.baseR * (b.popFrom + (1 - b.popFrom) * easeOutElastic(b.anim / POP_TIME));
  if (b.kind === 'power') { drawPowerUp(c, b.power, b.x, b.y, vr, gameTime); return; }

  const color = colorOf(b.tier, b.color);
  const opts = {
    sx: 1 + b.squash, sy: 1 - b.squash,
    look: { x: heldX - b.x, y: DROP_Y - b.y },
    blink: b.blink < 0,
    mood: b.overTime > 0 ? 'worried' : b.happy > 0 ? 'happy' : 'normal',
  };

  // The Sun has a warm, pulsing aura
  if (b.tier === LAST) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    const g = c.createRadialGradient(b.x, b.y, vr * 0.8, b.x, b.y, vr * 1.7);
    g.addColorStop(0, `rgba(255, 95, 210, ${0.28 + Math.sin(gameTime * 4) * 0.08})`);
    g.addColorStop(1, 'rgba(255, 95, 210, 0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(b.x, b.y, vr * 1.7, 0, TAU); c.fill();
    c.restore();
  }

  if (b.glitch > 0) {
    // Glitch flicker: red & cyan ghosts plus sliced, jittering stripes
    const k = b.glitch / GLITCH_TIME;
    const off = vr * 0.3 * k;
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.75 * k;
    drawSilhouette(c, b.tier, b.x + off, b.y, vr, b.angle, '#ff2d75');
    drawSilhouette(c, b.tier, b.x - off, b.y + off * 0.3, vr, b.angle, '#27e8ff');
    c.restore();
    const bands = 5, top = b.y - vr * 1.4, h = (vr * 2.8) / bands;
    for (let i = 0; i < bands; i++) {
      const shift = Math.random() < 0.5 ? (Math.random() - 0.5) * vr * 0.7 * k : 0;
      c.save();
      c.beginPath();
      c.rect(b.x - vr * 2, top + i * h, vr * 4, h + 0.5);
      c.clip();
      drawShape(c, b.tier, b.x + shift, b.y, vr, b.angle, color, opts);
      c.restore();
    }
  } else {
    drawShape(c, b.tier, b.x, b.y, vr, b.angle, color, opts);
  }
}

// Phones: score in the top-left corner and the Next shape in the top-right
function drawHud() {
  ctx.save();
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.font = `12px ${DISPLAY_FONT}`;
  ctx.fillStyle = '#a99bd6';
  ctx.fillText('SCORE', 12, 10);
  ctx.font = `28px ${DISPLAY_FONT}`;
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(String(shownScore), 12, 24);
  ctx.shadowBlur = 0;
  ctx.font = `12px ${DISPLAY_FONT}`;
  ctx.fillStyle = '#f5ff1f';
  ctx.fillText('BEST ' + highScore, 12, 56);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#a99bd6';
  ctx.fillText('NEXT', W - 12, 10);
  if (nextItem) drawItem(ctx, nextItem, W - 32, 50, Math.min(1, 17 / itemRadius(nextItem)));
  ctx.restore();
}

// The big message across the top ("NEW SHAPE!", "BOOM!", ...)
function drawBanner() {
  if (!banner) return;
  const p = banner.t / banner.dur;
  const s = banner.t < 0.25 ? easeOutElastic(banner.t / 0.25) : 1;
  ctx.save();
  ctx.globalAlpha = p > 0.75 ? (1 - p) / 0.25 : 1;
  ctx.translate(W / 2, CONTAINER_TOP + 70);
  ctx.rotate(-0.05);
  ctx.scale(s, s);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.font = `44px ${DISPLAY_FONT}`;
  ctx.lineWidth = 10;
  ctx.strokeStyle = 'rgba(20, 10, 40, 0.9)';
  ctx.strokeText(banner.text, 0, 0);
  ctx.fillStyle = banner.color;
  ctx.fillText(banner.text, 0, 0);
  if (banner.sub) {
    ctx.font = `20px ${DISPLAY_FONT}`;
    ctx.lineWidth = 6;
    ctx.strokeText(banner.sub, 0, 36);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(banner.sub, 0, 36);
  }
  ctx.restore();
}


/* =====================================================================
   J. SIDE PANELS - the Next box and the Evolution Key
   ===================================================================== */

// Sets up a small canvas so it looks sharp, and returns its drawing context
function prepSmallCanvas(c, w, h = w) {
  c.width = w * DPR;
  c.height = h * DPR;
  const cx = c.getContext('2d');
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  return cx;
}

function drawNextPreview() {
  const cx = prepSmallCanvas(document.getElementById('nextCanvas'), 96);
  drawItem(cx, nextItem, 48, 48, Math.min(1, 32 / itemRadius(nextItem)));
  document.getElementById('nextLabel').textContent =
    nextItem.kind === 'power' ? '✨ ' + POWERUPS[nextItem.power].name : (nextItem.sticky ? 'Sticky ' : '') + SHAPE_CHAIN[nextItem.tier].name;
}

// Builds the Evolution Key on the right (and the mini chain strip on phones)
function buildKey(flashNewest) {
  const list = document.getElementById('keyList');
  list.innerHTML = '';
  SHAPE_CHAIN.forEach((def, tier) => {
    const row = document.createElement('div');
    row.className = 'key-row';
    if (tier === maxTierReached && tier > 0) row.classList.add('reached');
    if (flashNewest && tier === maxTierReached) row.classList.add('flash');
    const c = document.createElement('canvas');
    // In Color Mode the key is grey, because any color can be any shape
    drawShape(prepSmallCanvas(c, 36), tier, 18, 19, 12, 0, colorMode ? '#cfc8ef' : def.color,
              { mood: tier <= maxTierReached ? 'happy' : 'normal' });
    row.appendChild(c);
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = def.name;
    row.appendChild(name);
    if (tier < DROPPABLE_TIERS) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = 'drops';
      row.appendChild(badge);
    }
    if (tier > 0) {
      const pts = document.createElement('span');
      pts.className = 'pts';
      pts.textContent = '+' + def.points;
      row.appendChild(pts);
    }
    list.appendChild(row);
    const arrow = document.createElement('div');
    arrow.className = 'key-arrow';
    arrow.textContent = tier < LAST ? '▼ two make one' : `two ${def.name}s = SUPERNOVA +${MAX_MERGE_BONUS}`;
    list.appendChild(arrow);
  });

  let html = colorMode
    ? '<div class="key-note"><b>Color Mode:</b> shapes must match in shape AND color to merge.</div><div class="swatches">' +
      COLOR_PALETTE.slice(0, NUM_COLORS).map(col => `<div class="swatch" style="background:${col}"></div>`).join('') + '</div>'
    : '<div class="key-note"><b>Classic Mode:</b> any two matching shapes merge.</div>';
  if (STICKY_CHANCE > 0) {
    html += `<h2>Sticky shapes</h2><div class="power-row"><canvas id="stickyIcon"></canvas><div><b>Covered in goo</b><br>Glues to whatever it touches for ${STICKY_TIME}s. Merge it to clear the goo early.</div></div>`;
  }
  html += '<h2>Power-ups</h2>';
  for (const k of Object.keys(POWERUPS)) {
    if (POWERUPS[k].enabled) html += `<div class="power-row"><canvas data-power="${k}"></canvas><div><b>${POWERUPS[k].name}</b><br>${POWERUPS[k].about}</div></div>`;
  }
  const extra = document.getElementById('keyExtra');
  extra.innerHTML = html;
  const stickyIcon = document.getElementById('stickyIcon');
  if (stickyIcon) {
    const sc = prepSmallCanvas(stickyIcon, 34);
    drawShape(sc, 2, 17, 16, 10, 0, colorMode ? '#cfc8ef' : SHAPE_CHAIN[2].color, {});
    drawGoo(sc, 17, 16, 10, 0.6, 1);
  }
  extra.querySelectorAll('canvas[data-power]').forEach(c => drawPowerUp(prepSmallCanvas(c, 34), c.dataset.power, 17, 18, 10, 0.4));

  drawChainStrip();
}

// Phones: a one-line version of the key above the game:  ● › ▲ › ■ ...
function drawChainStrip() {
  const c = document.getElementById('chainStrip');
  const w = c.clientWidth;
  if (!w) return;   // hidden on big screens
  const cx = prepSmallCanvas(c, w, 34);
  const gap = w / SHAPE_CHAIN.length;
  cx.font = '16px sans-serif';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  SHAPE_CHAIN.forEach((def, tier) => {
    const x = gap * (tier + 0.5);
    if (tier === maxTierReached && tier > 0) {
      cx.fillStyle = 'rgba(0, 240, 255, 0.22)';
      cx.beginPath(); cx.arc(x, 17, 16, 0, TAU); cx.fill();
    }
    drawShape(cx, tier, x, 17, 7 + tier * 0.9, 0, colorMode ? '#cfc8ef' : def.color, { face: false });
    if (tier < LAST) {
      cx.fillStyle = '#a69ed3';
      cx.fillText('›', x + gap / 2, 16);
    }
  });
}

// Fits the game on screen: never wider than the window or taller than it
function sizeCanvas() {
  const small = window.matchMedia('(max-width: 1000px)').matches;
  hudInCanvas = small;
  const taken = small ? 140 : 40;   // room for the key strip and buttons on phones
  const screenW = Math.min(window.innerWidth, document.documentElement.clientWidth || window.innerWidth);
  const w = Math.max(240, Math.min(W, screenW - 32, (window.innerHeight - taken) * W / H));
  canvas.style.width = w + 'px';
  drawChainStrip();
}


/* =====================================================================
   K. CONTROLS - mouse, touch, keyboard and buttons
   ===================================================================== */

// Turns a pointer position on the page into a position in the game world
function aimAt(clientX) {
  const rect = canvas.getBoundingClientRect();
  heldX = screenToWorldX(((clientX - rect.left) / rect.width) * W);
}

// Mouse: move to aim, click to drop. Touch: drag to aim, lift finger to drop.
let skipNextUp = false;
canvas.addEventListener('pointermove', e => aimAt(e.clientX));
canvas.addEventListener('pointerdown', e => {
  initAudio();
  if (state === 'paused') { state = 'playing'; skipNextUp = true; return; }
  aimAt(e.clientX);
  if (e.pointerType === 'mouse') { if (e.button === 0) drop(); }
  else canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', e => {
  if (skipNextUp) { skipNextUp = false; return; }
  if (e.pointerType !== 'mouse') drop();
});

window.addEventListener('keydown', e => {
  initAudio();
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keysDown[key] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) e.preventDefault(); // no page scrolling
  if (key === ' ' || key === 'ArrowDown') {
    if (state === 'over') restart();
    else drop();
  }
  if (key === 'p') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
  if (key === 'm') toggleMute();
});
window.addEventListener('keyup', e => {
  keysDown[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
});

// Pause automatically if you switch tabs
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') state = 'paused';
});
window.addEventListener('resize', sizeCanvas);

// Buttons. (blur() stops the Space key from "clicking" them again later.)
function onButton(id, fn) {
  const btn = document.getElementById(id);
  btn.addEventListener('click', () => { initAudio(); fn(); btn.blur(); });
}

function toggleMute() {
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇 Sound off' : '🔊 Sound on';
  try { localStorage.setItem('shapeDrop2_muted', muted ? '1' : '0'); } catch (e) {}
}

onButton('modeBtn', () => {
  colorMode = !colorMode;
  document.getElementById('modeBtn').textContent = colorMode ? 'Mode: Color 🎨' : 'Mode: Classic';
  restart();   // switching modes starts a new game
});
onButton('muteBtn', toggleMute);
onButton('restartBtn', restart);
onButton('playAgainBtn', restart);


/* =====================================================================
   L. MAIN LOOP - runs about 60 times every second
   ===================================================================== */
let lastTime = performance.now();
let physicsTimeBank = 0;   // leftover time, so physics runs at the same speed on every computer

function frame(now) {
  const realDt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  let dt = realDt;
  if (slowMo > 0) { slowMo -= realDt; dt *= 0.3; }   // slow motion on huge moments

  if (state === 'playing') {
    physicsTimeBank += dt;
    while (physicsTimeBank >= PHYSICS_STEP) {
      physicsStep(PHYSICS_STEP);
      physicsTimeBank -= PHYSICS_STEP;
    }
    updateGame(dt);
  } else if (state === 'ending') {
    updateEnding(realDt);
  }
  if (state !== 'paused') {
    gameTime += dt;
    updateFx(dt);
  }

  // The score on screen counts up smoothly to the real score
  if (shownScore !== score) {
    shownScore = score < shownScore ? score : Math.min(score, shownScore + Math.max(1, Math.ceil((score - shownScore) * realDt * 12)));
    document.getElementById('score').textContent = shownScore;
  }

  render();
  requestAnimationFrame(frame);
}

// ---- Let's go! ----
for (let i = 0; i < 12; i++) {   // faint background shapes
  floaters.push({ tier: i % SHAPE_CHAIN.length, x: rand(0, W), y: rand(0, H), r: rand(10, 30),
                  vy: rand(6, 16), a: rand(0, TAU), va: rand(-0.3, 0.3), alpha: rand(0.05, 0.1) });
}
try { if (localStorage.getItem('shapeDrop2_muted') === '1') toggleMute(); } catch (e) {}
sizeCanvas();
restart();
requestAnimationFrame(frame);
// Redraw the panels once the fancy fonts have loaded
if (document.fonts) document.fonts.ready.then(() => { buildKey(false); drawNextPreview(); });
</script>
</body>
</html>
